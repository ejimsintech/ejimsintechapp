img{content-visibility:auto;contain-intrinsic-size:200px 200px;}
/* lighter icons */
[class^="ri-"],[class*=" ri-"]{font-weight:300 !important;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
/* compress blur */
.backdrop-blur{backdrop-filter:blur(4px) !important;}


/* ===== PROFESSIONAL ADMIN RESTYLE - NO DELETION ===== */
:root{--admin-bg:#0A0A0B;--card-bg:#121214;--card-border:rgba(255,255,255,0.08);--text-primary:rgba(255,255,255,0.92);--text-secondary:rgba(255,255,255,0.55);--text-tertiary:rgba(255,255,255,0.35);--accent:#FF5722;}

/* Admin container */
.rounded-\[20px\].bg-\[\#121214\]{background:var(--card-bg) !important;border:1px solid var(--card-border) !important;box-shadow:0 1px 0 0 rgba(255,255,255,0.04) inset, 0 8px 32px rgba(0,0,0,0.4) !important;backdrop-filter:blur(12px);}

/* Table header - professional */
thead.bg-white\/\[0\.04\]{background:rgba(255,255,255,0.03) !important;}
thead th{font-size:11px !important;letter-spacing:0.08em !important;font-weight:600 !important;color:var(--text-tertiary) !important;text-transform:uppercase !important;padding-top:14px !important;padding-bottom:14px !important;}

/* Table rows */
tbody tr{transition:background 0.15s ease !important;}
tbody tr:hover{background:rgba(255,255,255,0.04) !important;}
tbody td{padding-top:16px !important;padding-bottom:16px !important;vertical-align:middle !important;border-color:rgba(255,255,255,0.05) !important;}

/* Message column - proper readable */
td.min-w-\[600px\] div, td.min-w-\[600px\] div[class*="text-white"]{font-size:13.5px !important;line-height:1.6 !important;color:rgba(255,255,255,0.72) !important;letter-spacing:-0.01em !important;}

/* Name */
span.text-\[14px\].font-medium{font-weight:600 !important;font-size:13.5px !important;color:var(--text-primary) !important;letter-spacing:-0.01em !important;}

/* Status badges - professional pill */
.bg-\[\#FF5722\]\/\[0\.04\]{background:rgba(255,87,34,0.06) !important;}
span[class*="rounded-full"][class*="bg-white"]{font-weight:500 !important;letter-spacing:0.02em !important;}

/* Buttons - professional */
button{font-weight:500 !important;letter-spacing:-0.01em !important;transition:all 0.15s ease !important;}
button:hover{transform:translateY(-1px);}
button:active{transform:translateY(0);}

/* Search and filters */
input[class*="rounded-\[12px\]"]{background:rgba(255,255,255,0.04) !important;border:1px solid rgba(255,255,255,0.08) !important;font-size:13px !important;transition:all 0.15s ease !important;}
input[class*="rounded-\[12px\]"]:focus{background:rgba(255,255,255,0.06) !important;border-color:rgba(255,87,34,0.3) !important;box-shadow:0 0 0 3px rgba(255,87,34,0.08) !important;}

/* Cards spacing */
.p-4,.p-5,.px-4{/* keep but ensure breathing */}

/* Scrollbar - professional */
.overflow-x-auto::-webkit-scrollbar{height:6px;}
.overflow-x-auto::-webkit-scrollbar-track{background:rgba(255,255,255,0.03);border-radius:3px;}
.overflow-x-auto::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px;}
.overflow-x-auto::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.18);}

/* Empty states and dividers */
.divide-y > * + *{border-color:rgba(255,255,255,0.06) !important;}

/* Professional typography */
h1,h2,h3{letter-spacing:-0.02em !important;font-weight:650 !important;}


/* ===== MODERN STANDARDS ADMIN DASHBOARD - 2024/2025 ===== */
/* Typography - Modern dashboard uses Inter/system */
*{font-family:Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif !important;}

/* Layout - Modern dashboard grid */
body{background:#08080A !important;}

/* Cards - Modern: 12px radius, subtle border, no heavy shadow */
.rounded-\[20px\].bg-\[\#121214\]{
  border-radius:12px !important;
  background:#111113 !important;
  border:1px solid #1E1E20 !important;
  box-shadow:0 1px 2px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.02) inset !important;
}

/* Header - Modern dashboard header: 48px height, border bottom */
thead.bg-white\/\[0\.04\]{
  background:#0E0E10 !important;
  border-bottom:1px solid #1E1E20 !important;
  position:sticky !important;
  top:0 !important;
  z-index:2 !important;
}
thead th{
  font-size:11px !important;
  font-weight:500 !important;
  letter-spacing:0.06em !important;
  color:rgba(255,255,255,0.4) !important;
  text-transform:uppercase !important;
  height:40px !important;
  border-bottom:1px solid #1E1E20 !important;
}

/* Rows - Modern: 44px min, subtle hover */
tbody tr{
  height:56px !important;
  border-bottom:1px solid rgba(255,255,255,0.04) !important;
  transition:background 0.1s ease !important;
}
tbody tr:last-child{border-bottom:none !important;}
tbody tr:hover{background:#151518 !important;}
tbody tr.bg-\[\#FF5722\]\/\[0\.04\]{background:rgba(255,87,34,0.04) !important;border-left:2px solid #FF5722 !important;}
tbody td{font-size:13px !important;}

/* Name - Modern: 14px medium */
span.text-\[14px\].font-medium{
  font-size:14px !important;
  font-weight:500 !important;
  color:#EDEDED !important;
  letter-spacing:-0.01em !important;
}

/* Message - Modern: 13px regular, 2 lines max with fade? But full visible per request, so keep readable */
td.min-w-\[600px\] div{
  font-size:13px !important;
  line-height:1.5 !important;
  color:rgba(255,255,255,0.65) !important;
  font-weight:400 !important;
  max-width:640px !important;
  display:-webkit-box !important;
  -webkit-line-clamp:3 !important;
  -webkit-box-orient:vertical !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  white-space:normal !important;
}

/* Status - Modern pill: 20px height, 6px radius, dot */
span[class*="rounded-full"][class*="bg-white"], div[class*="rounded-full"][class*="bg-orange"], span[class*="New"]{
  height:22px !important;
  border-radius:6px !important;
  font-size:11px !important;
  font-weight:500 !important;
  letter-spacing:0.02em !important;
  padding:0 8px !important;
}

/* Actions - Modern icon buttons: 28px, 6px radius */
button[class*="w-6"], button[class*="w-7"], button[class*="h-6"]{
  width:28px !important;
  height:28px !important;
  border-radius:6px !important;
  background:rgba(255,255,255,0.04) !important;
  border:1px solid rgba(255,255,255,0.06) !important;
}
button[class*="w-6"]:hover, button[class*="w-7"]:hover{background:rgba(255,255,255,0.08) !important;border-color:rgba(255,255,255,0.12) !important;}

/* Search - Modern: 36px height, 8px radius, subtle */
input[class*="rounded-\[12px\]"]{
  height:36px !important;
  border-radius:8px !important;
  background:#151518 !important;
  border:1px solid #1E1E20 !important;
  font-size:13px !important;
}
input[class*="rounded-\[12px\]"]:focus{background:#1A1A1E !important;border-color:#2A2A2E !important;box-shadow:0 0 0 2px rgba(255,255,255,0.04) !important;}

/* Scrollbar - Modern minimal */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#1E1E20;border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* Modern dashboard spacing */
.p-4{padding:16px !important;}
.p-5{padding:20px !important;}

/* Fix message not stacked - ensure proper width */
th.min-w-\[640px\]{min-width:520px !important;width:50% !important;}
.fixed.top-\[76px\]{white-space:nowrap!important;flex-wrap:nowrap!important;word-break:keep-all!important;overflow:hidden!important;text-overflow:ellipsis!important;max-width:95vw!important;left:50%!important;transform:translateX(-50%)!important;right:auto!important;}
td.min-w-\[600px\]{min-width:520px !important;width:50% !important;}

<script>
(function(){
  function ensureModal(){
    let m=document.getElementById('ejim-media-modal');
    if(m) return m;
    m=document.createElement('div');
    m.id='ejim-media-modal';
    m.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(10px)';
    m.innerHTML=`<div id="ejim-modal-box" style="max-width:92vw;max-height:92vh;width:min(900px,92vw);background:#121214;border:1px solid rgba(255,255,255,0.1);border-radius:20px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.6)"><div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><div id="ejim-modal-title" style="font-size:14px;font-weight:600;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65vw;"></div><div style="display:flex;gap:8px;"><button id="ejim-modal-download2" style="padding:0 14px;height:32px;border-radius:999px;background:rgba(255,255,255,0.1);color:white;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;"><i class='ri-download-2-line'></i> Download</button><button onclick="document.getElementById('ejim-media-modal').style.display='none'; const c=document.getElementById('ejim-modal-content'); if(c){ c.innerHTML=''; const aud=c.querySelector('audio'); if(aud) aud.pause(); const vid=c.querySelector('video'); if(vid) vid.pause(); }" style="width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,0.08);color:white;display:grid;place-items:center;"><i class='ri-close-line'></i></button></div></div><div id="ejim-modal-content" style="flex:1;overflow:auto;display:grid;place-items:center;min-height:240px;background:#070709;position:relative;"></div></div>`;
    document.body.appendChild(m);
    m.addEventListener('click', (e)=>{ if(e.target===m){ m.style.display='none'; const c=document.getElementById('ejim-modal-content'); if(c){ c.innerHTML=''; } }});
    return m;
  }
  function getExt(url){
    try{
      if(url.startsWith('data:')){
        let mime = url.substring(5, url.indexOf(';'));
        if(mime.includes('jpeg')) return 'jpg';
        if(mime.includes('png')) return 'png';
        if(mime.includes('gif')) return 'gif';
        if(mime.includes('webp')) return 'webp';
        if(mime.includes('svg')) return 'svg';
        if(mime.includes('mp3')) return 'mp3';
        if(mime.includes('mpeg')) return 'mp3';
        if(mime.includes('wav')) return 'wav';
        if(mime.includes('mp4')) return 'mp4';
        if(mime.includes('webm')) return 'webm';
        return mime.split('/')[1] || 'bin';
      }
      let u = url.split('?')[0].split('#')[0];
      let parts = u.split('.');
      if(parts.length>1){
        let ext = parts.pop().toLowerCase();
        if(ext.length<=5) return ext;
      }
    }catch{}
    return '';
  }
  window.__ejim_view = function(url, title, kind, asset){
    if(!url){ alert('No file available'); return; }
    const modal = ensureModal();
    const content = document.getElementById('ejim-modal-content');
    const titleEl = document.getElementById('ejim-modal-title');
    const dlBtn = document.getElementById('ejim-modal-download2');
    titleEl.textContent = title || 'Preview';
    dlBtn.onclick = function(){ window.__ejim_download(url, title); };
    content.innerHTML='';
    content.style.padding='0';
    if(kind==='audio'){
      // Check if url is actually audio, otherwise fallback to image view
      const isReallyAudio = url.startsWith('data:audio') || url.toLowerCase().match(/\.(mp3|wav|ogg|m4a|aac)/) || (asset && asset.fileUrl && asset.fileUrl.startsWith('data:audio'));
      if(!isReallyAudio && (url.match(/\.(jpg|jpeg|png|webp|gif)/i) || url.includes('unsplash'))){
        // Show image with audio placeholder
        const wrap=document.createElement('div');
        wrap.style.cssText='padding:24px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;';
        const img=document.createElement('img');
        img.src=url; img.style.maxWidth='100%'; img.style.maxHeight='50vh'; img.style.borderRadius='12px'; img.style.objectFit='contain';
        const note=document.createElement('div');

    if(!url){ alert('No file to download'); return; }
    const safeBase = (title||'ejimsin-asset').replace(/[^a-z0-9\-_ ]/gi,'_').trim().replace(/\s+/g,'_') || 'asset';
    const ext = getExt(url) || 'bin';
    const filename = safeBase + (safeBase.toLowerCase().endsWith('.'+ext.toLowerCase()) ? '' : '.'+ext);
    try{
      if(url.startsWith('data:')){
        // Direct data URL download
        const a=document.createElement('a');
        a.href=url;
        a.download=filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>a.remove(), 500);
        return;
      }
      if(url.startsWith('blob:')){
        const a=document.createElement('a');
        a.href=url;
        a.download=filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>a.remove(), 500);
        return;
      }
      // Try fetch as blob (works for unsplash and CORS-enabled)
      const res = await fetch(url, {mode:'cors'});
      if(!res.ok) throw new Error('fetch failed '+res.status);
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=blobUrl;
      a.download=filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ URL.revokeObjectURL(blobUrl); a.remove(); }, 2000);
    }catch(e){
      console.warn('Download fallback', e);
      // Fallback: open in new tab, browser will handle
      try{
        const a=document.createElement('a');
        a.href=url;
        a.download=filename;
        a.target='_blank';
        a.rel='noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
      }catch{
        window.open(url,'_blank');
      }
    }
  };
})();
</script>

      errEl.style.display="block";
    }
  };
  document.getElementById("do-google-login").onclick = async ()=>{
    const provider = new GoogleAuthProvider();
    const errEl = document.getElementById("login-error");
    try{
      await signInWithPopup(auth, provider);
      modal.style.display="none";
    }catch(err){
      errEl.textContent = err.message;
      errEl.style.display="block";
    }
  };
  document.getElementById("btn-logout").onclick = ()=> signOut(auth);
}

createAuthUI();

// --- CLOUD SYNC FUNCTIONS - Override localStorage ---
window.saveToCloud = async function(settings){
  if(!currentUser){
    // Fallback to localStorage if not logged in
    localStorage.setItem("ejim_siteSettings", JSON.stringify(settings));
    return;
  }
  try{
    await setDoc(doc(db, "settings", currentUser.uid), {
      ...settings,
      userId: currentUser.uid,
      updatedAt: serverTimestamp(),
      email: currentUser.email
    }, {merge:true});
    
    // Also save devices for cross-device tracking
    await setDoc(doc(db, "devices", currentUser.uid + "_" + navigator.userAgent.slice(0,50).replace(/[^a-zA-Z0-9]/g,"")), {
      userId: currentUser.uid,
      deviceName: navigator.platform + " - " + navigator.userAgent.slice(0,40),
      lastActive: serverTimestamp(),
      isOnline: true
    }, {merge:true});

    console.log("Saved to cloud");
  }catch(e){
    console.error("Cloud save failed, saving locally", e);
    localStorage.setItem("ejim_siteSettings", JSON.stringify(settings));
  }
};

// Hook into existing save button
function hookSaveButton(){
  const saveBtn = document.getElementById("sc-save");
  if(!saveBtn || saveBtn.dataset.hooked) return;
  saveBtn.dataset.hooked = "1";
  const originalOnClick = saveBtn.onclick;
  saveBtn.onclick = async function(){
    const o={
      moniepointNumber:document.getElementById("sc-monie")?.value.trim()||"",
      firstBankNumber:document.getElementById("sc-first")?.value.trim()||"",
      accountName:document.getElementById("sc-name")?.value.trim()||"",
      phoneNumber:document.getElementById("sc-phone")?.value.trim()||"",
      phoneRaw:document.getElementById("sc-praw")?.value.replace(/[^0-9]/g,"")||"",
      whatsappNumber:document.getElementById("sc-wa")?.value.replace(/[^0-9]/g,"")||"",
      whatsappDisplay:document.getElementById("sc-wad")?.value.trim()||"",
      email:document.getElementById("sc-email")?.value.trim()||"",
      sliderImages: (document.getElementById("sc-slider")?.value.split("\n").map(s=>s.trim()).filter(Boolean))||[]
    };
    // Save to cloud
    await window.saveToCloud(o);
    localStorage.setItem("ejim_siteSettings", JSON.stringify(o));
    const e=document.getElementById("sc-msg");
    if(e){ e.textContent = currentUser ? "Saved to cloud! Live on all devices." : "Saved locally! Login to sync to cloud."; setTimeout(()=>e.textContent="",4000); }
  };
}
setInterval(hookSaveButton, 1000);

// --- AUTH STATE - Cross-device login + Live Sync ---
onAuthStateChanged(auth, async (user)=>{
  const statusEl = document.getElementById("auth-status");
  const loginBtn = document.getElementById("btn-login");
  const logoutBtn = document.getElementById("btn-logout");
  const syncDot = document.getElementById("sync-dot");
  const syncText = document.getElementById("sync-text");

  if(user){
    currentUser = user;
    if(statusEl) statusEl.textContent = "Logged in: " + user.email;
    if(loginBtn) loginBtn.style.display="none";
    if(logoutBtn) logoutBtn.style.display="block";
    if(syncDot) syncDot.style.background="#22c55e";
    if(syncText) syncText.textContent="Live Sync ON";

    // Stop previous listener
    if(unsubscribeSettings) unsubscribeSettings();

    // Feature 1: Live Synchronization + Feature 2: Cloud Sync
    const settingsRef = doc(db, "settings", user.uid);
    unsubscribeSettings = onSnapshot(settingsRef, (snap)=>{
      if(snap.exists()){
        const cloudData = snap.data();
        console.log("Live update from cloud:", cloudData);
        // Merge into localStorage so existing G() function reads it
        const localData = {
          moniepointNumber: cloudData.moniepointNumber,
          firstBankNumber: cloudData.firstBankNumber,
          accountName: cloudData.accountName,
          phoneNumber: cloudData.phoneNumber,
          phoneRaw: cloudData.phoneRaw,
          whatsappNumber: cloudData.whatsappNumber,
          whatsappDisplay: cloudData.whatsappDisplay,
          email: cloudData.email,
          sliderImages: cloudData.sliderImages || []
        };
        localStorage.setItem("ejim_siteSettings", JSON.stringify(localData));
        // Force reload of settings UI if open
        const mount = document.getElementById("siteconfig-mount");
        if(mount && mount.dataset.done==="1"){
          mount.dataset.done="0";
        }
        if(window.Reflect) setTimeout(()=>{ try{ Reflect(); }catch(e){} }, 500);
        
        // Show toast
        if(snap.metadata.hasPendingWrites===false){
          // Only show if change came from server (other device)
        }
      } else {
        // No cloud data yet, upload local data to cloud
        try{
          const local = localStorage.getItem("ejim_siteSettings");
          if(local){
            const parsed = JSON.parse(local);
            await setDoc(settingsRef, {...parsed, userId:user.uid, updatedAt: serverTimestamp()}, {merge:true});
          }
        }catch(e){}
      }
    }, (err)=>{
      console.error("Live sync error:", err);
      if(syncDot) syncDot.style.background="#ef4444";
      if(syncText) syncText.textContent="Sync error";
    });

  } else {
    currentUser = null;
    if(statusEl) statusEl.textContent="Not logged in - Local mode (Login to enable cloud sync)";
    if(loginBtn) loginBtn.style.display="block";
    if(logoutBtn) logoutBtn.style.display="none";
    if(syncDot) syncDot.style.background="#ef4444";
    if(syncText) syncText.textContent="Local only";
    if(unsubscribeSettings) { unsubscribeSettings(); unsubscribeSettings=null; }
  }
});

// Online/offline indicator - Feature 4
window.addEventListener('online', ()=>{
  const dot = document.getElementById("sync-dot");
  const txt = document.getElementById("sync-text");
  if(dot && currentUser) dot.style.background="#22c55e";
  if(txt && currentUser) txt.textContent="Back online - Syncing...";
});
window.addEventListener('offline', ()=>{
  const dot = document.getElementById("sync-dot");
  const txt = document.getElementById("sync-text");
  if(dot) dot.style.background="#f59e0b";
  if(txt) txt.textContent="Offline - Will sync when online";
});

console.log("Firebase 4-features ready: Live Sync, Cloud Sync, Cross-device, Internet Access");
</script>
